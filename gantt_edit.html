<!DOCTYPE html>
<html lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>שיבוץ עובדים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#F5F4F0;--sur:#fff;--brd:#E0DED8;--txt:#1A1A18;--mut:#888780;--fnt:#B4B2A9;--acc:#378ADD;--r:8px;}
body{font-family:'Heebo',sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;direction:rtl;}

/* topbar */
.topbar{height:52px;background:var(--sur);border-bottom:1px solid var(--brd);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0;}
.topbar h1{font-size:14px;font-weight:700;margin-right:auto;}
.btn{font-family:'Heebo',sans-serif;font-size:12px;padding:6px 11px;border:1px solid var(--brd);border-radius:var(--r);background:var(--sur);cursor:pointer;color:var(--txt);white-space:nowrap;}
.btn:hover{background:var(--bg);}
.btn-p{background:var(--acc);color:#fff;border-color:var(--acc);}
.btn-p:hover{background:#2b6db5;}
.btn-sm{padding:4px 8px;font-size:11px;}
.zbtn{width:24px;height:24px;border:1px solid var(--brd);border-radius:5px;background:none;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;}
.zbtn:hover{background:var(--bg);}
.zlbl{font-size:11px;color:var(--mut);min-width:30px;text-align:center;}

/* filter */
.fbar{height:34px;background:var(--sur);border-bottom:1px solid var(--brd);padding:0 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;overflow-x:auto;}
.fbar::-webkit-scrollbar{display:none;}
.flbl{font-size:11px;color:var(--mut);white-space:nowrap;}
.chip{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--brd);cursor:pointer;background:var(--bg);white-space:nowrap;}
.chip.on{border-color:transparent;color:#fff;}

/* MAIN LAYOUT — LTR so timeline flows left→right */
.main{display:flex;flex:1;overflow:hidden;min-height:0;direction:rtl;}

/* project panel — rightmost in RTL = leftmost in LTR flex */
.resize-handle{width:5px;cursor:col-resize;background:transparent;flex-shrink:0;transition:background .15s;}
.resize-handle:hover,.resize-handle.dragging{background:var(--accent,#378ADD);}
.ppanel{width:155px;min-width:80px;flex-shrink:0;background:var(--sur);border-left:2px solid var(--brd);display:flex;flex-direction:column;direction:rtl;overflow:hidden;}
.ppanel-hdr{padding:7px 9px;font-size:11px;font-weight:700;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
.plist{flex:1;overflow-y:auto;padding:5px;}
.pitem{display:flex;align-items:center;gap:6px;padding:5px;border-radius:5px;}
.pitem:hover{background:var(--bg);}
.psq{width:11px;height:11px;border-radius:2px;flex-shrink:0;}
.pname{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}
.pdel{opacity:0;background:none;border:none;cursor:pointer;color:var(--fnt);font-size:11px;padding:0 2px;}
.pitem:hover .pdel{opacity:1;}

/* workers sidebar */
.sidebar{width:190px;min-width:120px;flex-shrink:0;display:flex;flex-direction:column;border-left:2px solid var(--brd);background:var(--sur);z-index:20;direction:rtl;overflow:hidden;}
.stop{border-bottom:2px solid var(--brd);display:flex;align-items:center;justify-content:center;padding:0 10px;font-size:12px;font-weight:700;flex-shrink:0;position:sticky;top:0;z-index:25;background:var(--sur);}
.sbody{overflow:hidden;flex:1;position:relative;}
.ghdr-s{display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;color:#fff;flex-shrink:0;}
.wrow{display:flex;align-items:center;padding:0 10px 0 6px;border-bottom:1px solid var(--brd);gap:5px;position:relative;}
.wrow:hover{background:#f8f8f6;}
.wname{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;}
.wedit{opacity:0;background:none;border:none;cursor:pointer;font-size:11px;padding:1px 3px;color:var(--mut);flex-shrink:0;}
.wrow:hover .wedit{opacity:1;}

/* TIMELINE AREA */
.tlwrap{flex:1;overflow:auto;min-width:0;direction:rtl;}
.tlwrap::-webkit-scrollbar{height:5px;width:5px;}
.tlwrap::-webkit-scrollbar-thumb{background:var(--brd);border-radius:3px;}
.tlinner{display:inline-block;position:relative;direction:ltr;}

/* Sprint row */
.sprrow{display:flex;align-items:center;border-bottom:1px solid var(--brd);background:var(--bg);direction:ltr;}
.spr-empty{flex-shrink:0;}
.spr-filled{flex-shrink:0;background:#1E3A5F;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;overflow:hidden;white-space:nowrap;padding:0 6px;border-radius:4px;margin:3px 1px;}
.spr-filled:hover{background:#2a4f80;}

/* Month row */
.mrow{display:flex;border-bottom:1px solid var(--brd);background:var(--sur);direction:ltr;}
.mcell{border-right:2px solid var(--brd);display:flex;align-items:center;justify-content:center;padding:0 4px;font-size:11px;font-weight:700;color:var(--mut);white-space:nowrap;flex-shrink:0;overflow:hidden;}

/* Week row */
.wkrow{display:flex;border-bottom:1px solid var(--brd);background:var(--sur);direction:ltr;}
.wkcell{border-right:1px solid #ccc;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--fnt);flex-shrink:0;}
.wkcell.tw{background:#EBF4FF;border-right-color:#ccc !important;}
.wkcell.tw span{color:var(--acc);font-weight:700;}

/* Body */
.tlbody{position:relative;direction:ltr;}
.ghdr-tl{border-bottom:2px solid;position:relative;display:flex;align-items:center;}
.tlrow{border-bottom:1px solid var(--brd);position:relative;display:flex;direction:ltr;}
.tlrow:hover{background:#fafaf8;}
.tcell{border-right:1px solid #ccc;flex-shrink:0;}
.tcell.tw{background:rgba(55,138,221,.04);border-right-color:#ccc !important;}

/* Today line */
.todayline{display:none !important;}

/* Blocks */
.bl-row{border-bottom:1px solid #E0DED8;position:relative;display:flex;direction:ltr;}
.bl-cell{border-right:1px solid #d8d6d0;flex-shrink:0;}
.bl-blk{position:absolute;top:2px;border-radius:3px;opacity:.55;background-repeating-linear-gradient:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.3) 3px,rgba(255,255,255,.3) 6px);pointer-events:none;}
.milestone-line{position:absolute;top:8px;width:2px;z-index:8;pointer-events:none;border-left:2px dashed;opacity:.55;}
.milestone-dot{position:absolute;top:2px;transform:translateX(-50%);z-index:9;cursor:pointer;width:12px;height:12px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);transition:transform .15s;}
.milestone-dot:hover{transform:translateX(-50%) scale(1.4);}
.milestone-tooltip{position:fixed;background:#1E3A5F;color:#fff;font-size:11px;font-weight:600;padding:4px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;z-index:500;box-shadow:0 2px 8px rgba(0,0,0,.25);display:none;}
.blk{position:absolute;top:5px;border-radius:5px;cursor:grab;display:flex;align-items:center;padding:0 6px;font-size:11px;color:#fff;overflow:hidden;user-select:none;z-index:5;gap:3px;direction:rtl;}
.blk:hover{opacity:.92;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.blk-tooltip{position:fixed;background:rgba(255,255,255,.15);backdrop-filter:blur(6px);color:#1A5FA8;font-size:12px;padding:5px 10px;border-radius:7px;border:1px solid rgba(107,159,204,.25);pointer-events:none;z-index:500;max-width:220px;white-space:pre-wrap;direction:rtl;display:none;line-height:1.5;}
.blk:hover .bedit{opacity:1;}
.blk.selected{outline:2px solid rgba(255,255,255,.8);outline-offset:-2px;}
.blk.drag{opacity:.65;cursor:grabbing;z-index:100;}
.btitle{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;flex-shrink:0;max-width:60%;}

.bedit{opacity:0;background:rgba(255,255,255,.22);border:none;cursor:pointer;font-size:10px;padding:1px 4px;border-radius:3px;color:#fff;flex-shrink:0;}
.binput{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.5);border-radius:3px;color:#fff;font-family:'Heebo',sans-serif;font-size:11px;padding:1px 5px;width:90px;outline:none;direction:rtl;}
.blk-notefield{font-size:10px;color:rgba(255,255,255,.95);outline:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;border-radius:3px;padding:1px 3px;direction:rtl;flex:1;min-width:0;}
.blk-notefield:focus{background:rgba(255,255,255,.15);white-space:normal;overflow:visible;}

.binput::placeholder{color:rgba(255,255,255,.6);}
.rhandle{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;}
.lhandle{position:absolute;left:0;top:0;bottom:0;width:7px;cursor:col-resize;}
.lhandle:hover{background:rgba(255,255,255,.3);}
.rhandle:hover{background:rgba(255,255,255,.3);}

/* Modals */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.25);backdrop-filter:blur(2px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem;direction:rtl;}
.ov.open{display:flex;animation:fi .15s;}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:var(--sur);border-radius:12px;border:1px solid var(--brd);width:100%;max-width:350px;box-shadow:0 8px 40px rgba(0,0,0,.18);animation:pi .18s cubic-bezier(.34,1.56,.64,1);}
@keyframes pi{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mhdr{padding:.8rem 1rem .6rem;border-bottom:1px solid var(--brd);display:flex;align-items:center;justify-content:space-between;}
.mtitle{font-size:14px;font-weight:700;}
.mx{background:none;border:none;cursor:pointer;font-size:16px;color:var(--fnt);}
.mbody{padding:.85rem 1rem;}
.mfoot{padding:.6rem 1rem;border-top:1px solid var(--brd);display:flex;justify-content:flex-start;gap:7px;}
.fld{margin-bottom:.75rem;}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:3px;}
.fld input,.fld select{width:100%;font-family:'Heebo',sans-serif;font-size:13px;padding:7px 9px;border:1px solid var(--brd);border-radius:var(--r);background:var(--bg);color:var(--txt);outline:none;direction:rtl;}
.fld input:focus,.fld select:focus{border-color:var(--acc);}
.crow{display:flex;gap:5px;flex-wrap:wrap;}
.copt{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;}
.copt:hover{transform:scale(1.1);}
.copt.on{border-color:#222;transform:scale(1.1);}
.qbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}

/* Context menu */
.ctx{position:fixed;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,.15);z-index:300;min-width:140px;padding:4px 0;display:none;direction:rtl;}
.ctx.open{display:block;}
.ci{padding:7px 13px;font-size:12px;cursor:pointer;}
.ci:hover{background:var(--bg);}
.ci.del{color:#E24B4A;}
</style>
  <!-- Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDOIwsCqDyivx8kdCUQHEVPTWFYFfB-yFw",
      authDomain: "scheduling-a5647.firebaseapp.com",
      projectId: "scheduling-a5647",
      storageBucket: "scheduling-a5647.firebasestorage.app",
      messagingSenderId: "1086458270592",
      appId: "1:1086458270592:web:1dff903b00ed4e62426765"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const DOC_REF = doc(db, 'gantt', 'data');

    // Override save: write to Firestore
    window._fbSave = async function(data) {
      try {
        await setDoc(DOC_REF, { payload: JSON.stringify(data) });
      } catch(e) {
        console.error('Firebase save error:', e);
        // Fallback to localStorage
        localStorage.setItem('gantt7', JSON.stringify(data));
      }
    };

    // Override load: read from Firestore
    window._fbLoad = async function() {
      try {
        const snap = await getDoc(DOC_REF);
        if (snap.exists()) {
          return JSON.parse(snap.data().payload);
        }
      } catch(e) {
        console.error('Firebase load error:', e);
      }
      // Fallback to localStorage
      const local = localStorage.getItem('gantt7');
      return local ? JSON.parse(local) : null;
    };

    // Real-time listener: update when another user changes data
    let _ignoreNext = false;
    onSnapshot(DOC_REF, (snap) => {
      if (!snap.exists()) return;
      if (_ignoreNext) { _ignoreNext = false; return; }
      try {
        const remote = JSON.parse(snap.data().payload);
        // Only update if different from current
        if (JSON.stringify(remote) !== JSON.stringify(window.D)) {
          window.D = remote;
          if(!window.D.milestones) window.D.milestones = [];
          if(!window.D.groups) window.D.groups = [];
          if(!window.D.baselines) window.D.baselines = [];
          if(typeof window.render === 'function') window.render();
          window.showToast && window.showToast('הנתונים עודכנו 🔄');
        }
      } catch(e) {}
    });

    window._fbIgnoreNext = function() { _ignoreNext = true; };
  </script>
</head>
<body>

<div class="topbar">
  <h1>📋 שיבוץ עובדים</h1>
  <div style="display:flex;align-items:center;gap:3px;">
    <button class="zbtn" onclick="doZoom(-1)">−</button>
    <span class="zlbl" id="zlbl">100%</span>
    <button class="zbtn" onclick="doZoom(1)">+</button>
  </div>
  <button class="btn edit-only" onclick="openWM()">+ עובד</button>
  <button class="btn edit-only" onclick="openPM()">+ פרויקט</button>
  <button class="btn edit-only" onclick="openSprM()">+ ספרינט</button>
  <button class="btn btn-p edit-only" onclick="openAM('','','','',null)">שבץ</button>
  <div id="absence-drag-btn" class="btn edit-only" title="גרור לציר הזמן לשיבוץ העדרות" style="cursor:grab;display:inline-flex;align-items:center;gap:5px;user-select:none;"><span style="width:10px;height:10px;border-radius:50%;background:#2C2C2C;display:inline-block;"></span><span>העדרות</span></div>
  <button class="btn edit-only" onclick="openMsM(null)">🚩 אבן דרך</button>
  <button class="btn edit-only" onclick="openRangeM()">📅 טווח</button>
  <div style="position:relative;display:inline-block;">
    <button class="btn" onclick="toggleImportMenu()">📂 ייבוא ▾</button>
    <div id="import-menu" style="display:none;position:absolute;top:100%;right:0;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;min-width:150px;padding:4px 0;margin-top:2px;">
      <div class="ci" onclick="triggerImport('workers')">👥 ייבוא עובדים</div>
      <div class="ci" onclick="triggerImport('sprints')">🏃 ייבוא ספרינטים</div>
      <div class="ci" onclick="triggerImport('milestones')">🚩 ייבוא אבני דרך</div>
      <div class="ci" onclick="triggerImport('projects')">📁 ייבוא פרויקטים</div>
      <div class="ci" onclick="triggerImport('assignments')">📋 ייבוא שיבוץ</div>
    </div>
  </div>
  <input type="file" id="import-input" accept=".csv,.txt" style="display:none" onchange="handleImport(event)"/>
  <div style="position:relative;display:inline-block;" id="bl-menu-wrap">
    <button class="btn" onclick="toggleBLMenu()">📌 בייסליין</button>
    <div id="bl-menu" style="display:none;position:absolute;top:100%;right:0;background:var(--sur);border:1px solid var(--brd);border-radius:var(--r);box-shadow:0 4px 16px rgba(0,0,0,.12);z-index:100;min-width:180px;padding:4px 0;margin-top:2px;direction:rtl;">
    </div>
  </div>
  <button class="btn" onclick="openSummary()">📊 מבט על</button>
  <button class="btn" onclick="exportCSV()">📥 Excel</button>
  <button class="btn" onclick="exportProjects()">📁 ייצוא פרויקטים</button>
  <button class="btn" id="lock-btn" onclick="toggleEdit()" style="margin-right:auto;">🔒 עריכה</button>
</div>

<div class="fbar" id="fbar"></div>

<div class="main">
  <!-- order in LTR: ppanel | sidebar | timeline -->
  <div class="ppanel" id="ppanel">
    <div class="ppanel-hdr">פרויקטים <button class="btn btn-sm" onclick="openPM()">+</button></div>
    <div class="plist" id="plist"></div>
  </div>
  <div class="resize-handle" id="rh-pp" title="גרור לשינוי רוחב פרויקטים"></div>
  <div class="sidebar" id="sidebar">
    <div class="stop" id="stop">עובדים</div>
    <div class="sbody" id="sbody"></div>
  </div>
  <div class="resize-handle" id="rh-sb" title="גרור לשינוי רוחב"></div>
  <div class="tlwrap" id="tlwrap">
    <div class="tlinner" id="tlinner">
      <div id="tl-hdr" style="position:sticky;top:0;z-index:15;background:var(--sur);">
        <div class="sprrow" id="sprrow"></div>
        <div class="mrow" id="mrow"></div>
        <div class="wkrow" id="wkrow"></div>
      </div>
      <div class="tlbody" id="tlbody"></div>
      <div class="todayline" id="todayline" style="display:none"></div>
    </div>
  </div>
</div>

<!-- Worker modal -->
<div class="ov" id="wmodal" onclick="if(event.target===this)cm('wmodal')">

    <div class="mbody">

<!-- Sprint modal -->

  <div class="modal">

    <div class="mbody">

<script>
// ── data ──────────────────────────────────────────────────────────────────────
var D={workers:[],projects:[],assignments:[],teams:[],sprints:[],groups:[],milestones:[]};
try{var _s=localStorage.getItem('gantt7');if(_s)D=JSON.parse(_s);}catch(e){}
if(!D.sprints)D.sprints=[];
if(!D.groups)D.groups=[];
  if(!D.milestones)D.milestones=[];
var _undoStack=[], _redoStack=[];
function snapshot(){
  _undoStack.push(JSON.stringify(D));
  if(_undoStack.length>10)_undoStack.shift();
  _redoStack=[];
}
function save(){
  try{localStorage.setItem('gantt7',JSON.stringify(D));}catch(e){}
  if(window._fbSave){window._fbIgnoreNext&&window._fbIgnoreNext();window._fbSave(D);}
}

var COLS=['#E24B4A','#378ADD','#3BA868','#E07B20','#9B59B6','#D4AC0D','#00BCD4','#E91E8C','#00897B','#FF5722','#1565C0','#F06292','#2E7D32','#FF6F00','#4527A0','#827717','#006064','#880E4F','#BF360C','#0D47A1','#33691E','#E65100','#4A148C','#F57F17','#004D40','#B71C1C','#1A237E','#F9A825','#01579B','#1B5E20'];
var selCol=0, ZL=100, FT='all', FG='all', FP='all';
var _blkId=null,_wrkId=null,_sprId=null,_aId=null,_ewId=null,_esId=null,_selBlkId=null;

// ── dates ─────────────────────────────────────────────────────────────────────
var TODAY=new Date(); TODAY.setHours(12,0,0,0);

function pd(s){ // parse YYYY-MM-DD
  var p=s.split('-');
  return new Date(+p[0],+p[1]-1,+p[2],12,0,0,0);
}
function fd(d){ // format to YYYY-MM-DD
  var y=d.getFullYear(),m=d.getMonth()+1,dd=d.getDate();
  return y+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;
}
function sunday(d){ // previous or same Sunday
  var dt=new Date(d); dt.setDate(dt.getDate()-dt.getDay()); dt.setHours(12,0,0,0); return dt;
}
function addW(d,n){return new Date(d.getTime()+n*7*86400000);}
function addD(d,n){return new Date(d.getTime()+n*86400000);}
function diffW(a,b){return (b.getTime()-a.getTime())/(7*86400000);}

// ── timeline state ────────────────────────────────────────────────────────────
var TL_START=sunday(addW(TODAY,-4));
var TL_WEEKS=64;

function WW(){
  var base=Math.round(80*ZL/100);
  var wrap=document.getElementById('tlwrap');
  if(!wrap)return base;
  var avail=wrap.clientWidth||800;
  return Math.max(base, Math.floor(avail/TL_WEEKS));
}
function totalW(){return TL_WEEKS*WW();}
function wkDate(i){return addW(TL_START,i);}
function dateX(s){return (TL_WEEKS-1-diffW(TL_START,pd(s)))*WW();}
function xDate(x){return fd(addW(TL_START,TL_WEEKS-1-Math.round(x/WW())));}

// ── groups ────────────────────────────────────────────────────────────────────
function fws(){
  var ws=D.workers;
  if(FG!=='all') ws=ws.filter(function(w){return w.group===FG;});
  if(FT!=='all') ws=ws.filter(function(w){return w.team===FT;});
  if(FP!=='all'){
    ws=ws.filter(function(w){
      return D.assignments.some(function(a){return a.workerId===w.id&&a.projectId===FP;}) ||
             D.assignments.some(function(a){return a.workerId==='team_'+D.teams.find(function(t){
               return D.workers.some(function(ww){return ww.id===w.id&&ww.team===t.id;});
             })&&a.projectId===FP;});
    });
  }
  return ws;
}
var GROUP_GRAYS=['#5C6470','#8A939F','#B8BFC8'];
function getGroupColor(teamObj){
  if(!teamObj)return '#888';
  // find which group this team belongs to via workers
  var w=D.workers.find(function(w){return w.team===teamObj.id&&w.group;});
  if(!w||!w.group)return '#6B7280';
  var gi=D.groups.findIndex(function(g){return g.id===w.group;});
  return GROUP_GRAYS[gi%GROUP_GRAYS.length]||'#6B7280';
}
function getGroups(){
  var ws=fws(),gs=[];
  // Sort teams by group order
  var ORDER=['מודלים','תוכנה','QA'];
  function groupOrder(teamObj){
    if(!teamObj)return 9999;
    var w=D.workers.find(function(w){return w.team===teamObj.id&&w.group;});
    if(!w||!w.group)return 9998;
    var grp=D.groups.find(function(g){return g.id===w.group;});
    if(!grp)return 9997;
    var idx=ORDER.indexOf(grp.name);
    return idx>=0?idx:D.groups.findIndex(function(g){return g.id===w.group;});
  }
  var sortedTeams=D.teams.slice().sort(function(a,b){return groupOrder(a)-groupOrder(b);});
  sortedTeams.forEach(function(t){var tw=ws.filter(function(w){return w.team===t.id;});if(tw.length)gs.push({team:t,workers:tw});});
  var no=ws.filter(function(w){return !w.team||!D.teams.find(function(t){return t.id===w.team;});});
  if(no.length)gs.push({team:null,workers:no});
  return gs;
}

// ── render ────────────────────────────────────────────────────────────────────
var SPH=34, MH=36, WH=28, RH=40, GH=26;

function lightenColor(hex,amount){
  var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.round(r+(255-r)*amount);g=Math.round(g+(255-g)*amount);b=Math.round(b+(255-b)*amount);
  return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0');
}
function getDisplayColor(proj){
  if(proj.status==='שיבוץ על') return lightenColor(proj.color,0.45);
  return proj.color;
}
// ── baseline ─────────────────────────────────────────────────────────────────
var MAX_BL=3;
var _activeBL=null;

function getBaselines(){
  try{return JSON.parse(localStorage.getItem('gantt7_baselines')||'[]');}catch(e){return [];}
}
function saveBaselines(bls){localStorage.setItem('gantt7_baselines',JSON.stringify(bls));}

function toggleBLMenu(){
  var menu=document.getElementById('bl-menu');
  if(menu.style.display==='none'){
    buildBLMenu();
    menu.style.display='block';
    setTimeout(function(){document.addEventListener('click',function closeBL(e){
      if(!e.target.closest('#bl-menu-wrap')){menu.style.display='none';document.removeEventListener('click',closeBL);}
    },{once:true});},10);
  } else {
    menu.style.display='none';
  }
}

function buildBLMenu(){
  var menu=document.getElementById('bl-menu');
  menu.innerHTML='';
  var bls=getBaselines();
  if(bls.length<MAX_BL){
    var saveBtn=document.createElement('div');saveBtn.className='ci';saveBtn.textContent='💾 שמור בייסליין חדש';
    saveBtn.onclick=function(){saveNewBaseline();menu.style.display='none';};menu.appendChild(saveBtn);
    var sep=document.createElement('div');sep.style.cssText='height:1px;background:var(--brd);margin:4px 0;';menu.appendChild(sep);
  }
  if(bls.length===0){
    var empty=document.createElement('div');empty.style.cssText='padding:8px 13px;font-size:12px;color:var(--mut);';empty.textContent='אין בייסליינים שמורים';menu.appendChild(empty);
  } else {
    bls.forEach(function(bl,i){
      var row=document.createElement('div');row.style.cssText='display:flex;align-items:center;padding:4px 8px;gap:4px;';
      var showBtn=document.createElement('div');showBtn.className='ci';showBtn.style.cssText='flex:1;padding:4px 6px;border-radius:5px;'+(_activeBL===i?'background:var(--acc);color:#fff;':'');
      showBtn.textContent=(_activeBL===i?'✓ ':'')+'בייסליין '+(i+1)+' — '+bl.date;
      showBtn.onclick=function(){_activeBL=(_activeBL===i)?null:i;menu.style.display='none';render();};
      var delBtn=document.createElement('button');delBtn.style.cssText='background:none;border:none;cursor:pointer;color:var(--fnt);font-size:12px;padding:0 2px;';delBtn.textContent='✕';
      delBtn.onclick=function(e){e.stopPropagation();var bls2=getBaselines();bls2.splice(i,1);saveBaselines(bls2);if(_activeBL===i)_activeBL=null;else if(_activeBL>i)_activeBL--;buildBLMenu();render();};
      row.appendChild(showBtn);row.appendChild(delBtn);menu.appendChild(row);
    });
    if(_activeBL!==null){
      var sep2=document.createElement('div');sep2.style.cssText='height:1px;background:var(--brd);margin:4px 0;';menu.appendChild(sep2);
      var clearBtn=document.createElement('div');clearBtn.className='ci';clearBtn.textContent='🚫 נקה תצוגת בייסליין';
      clearBtn.onclick=function(){_activeBL=null;menu.style.display='none';render();};menu.appendChild(clearBtn);
    }
  }
}

function saveNewBaseline(){
  var bls=getBaselines();
  if(bls.length>=MAX_BL){showToast('הגעת למקסימום 3 בייסליינים');return;}
  var now=new Date();
  var dateStr=now.getDate()+'/'+(now.getMonth()+1)+'/'+now.getFullYear();
  bls.push({date:dateStr,assignments:JSON.parse(JSON.stringify(D.assignments))});
  saveBaselines(bls);showToast('בייסליין נשמר ✓');
}

function initPanelResize(handleId,panelId,minW,maxW){
  var handle=document.getElementById(handleId);
  var panel=document.getElementById(panelId);
  if(!handle||!panel)return;
  var startX,startW;
  handle.addEventListener('mousedown',function(e){
    e.preventDefault();e.stopPropagation();
    startX=e.clientX;startW=panel.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor='col-resize';
    document.body.style.userSelect='none';
    function onMove(e){
      var dx=startX-e.clientX;
      var nw=Math.max(minW,Math.min(maxW,startW+dx));
      panel.style.width=nw+'px';
      panel.style.minWidth=nw+'px';
    }
    function onUp(){
      handle.classList.remove('dragging');
      document.body.style.cursor='';
      document.body.style.userSelect='';
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });
}
function render(){
  window.D = D;
  var TW=totalW(), WW_=WW();
  var gs=getGroups();
  var BL_ROW_H=(_activeBL!==null&&getBaselines()[_activeBL])?20:0;
  var totalH=0; gs.forEach(function(g){totalH+=GH+g.workers.length*(RH+BL_ROW_H);});

  document.getElementById('tlinner').style.width=TW+'px';


  // ── sprint row ──
  var sprrow=document.getElementById('sprrow');
  sprrow.innerHTML=''; sprrow.style.width=TW+'px'; sprrow.style.height=SPH+'px';
  // build week→sprint map
  var wsprints=[];
  for(var i=0;i<TL_WEEKS;i++){
    var wd=wkDate(i).getTime(), sp=null;
    for(var si=0;si<D.sprints.length;si++){
      var sv=D.sprints[si];
      var ss=pd(sv.start).getTime(), se=pd(sv.end).getTime()+6*86400000;
      if(wd>=ss&&wd<=se){sp=sv;break;}
    }
    wsprints.push(sp);
  }
  // render consecutive blocks RTL
  var ri=TL_WEEKS-1;
  while(ri>=0){
    if(!wsprints[ri]){
      var el=document.createElement('div'); el.className='spr-empty';
      el.style.width=WW_+'px'; el.style.height=SPH+'px';
      sprrow.appendChild(el); ri--;
    } else {
      var sp=wsprints[ri], endRi=ri;
      while(ri>=0&&wsprints[ri]&&wsprints[ri].id===sp.id)ri--;
      var count=endRi-ri;
      var inner=document.createElement('div'); inner.className='spr-filled';
      inner.style.width=(count*WW_-2)+'px';
      inner.style.height=(SPH-6)+'px';
      inner.style.boxShadow='0 1px 4px rgba(0,0,0,.2)';
      inner.style.display='flex';
      inner.style.alignItems='center';
      inner.style.justifyContent='space-between';
      inner.style.padding='0 6px';
      var spName=document.createElement('span');
      spName.textContent=sp.name;
      spName.style.cssText='overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;';
      var spDel=document.createElement('button');
      spDel.textContent='🗑';
      spDel.style.cssText='background:rgba(255,255,255,.2);border:none;color:#fff;cursor:pointer;border-radius:3px;padding:0 4px;font-size:10px;flex-shrink:0;opacity:0;margin-right:2px;';
      inner.appendChild(spName);
      inner.appendChild(spDel);
      inner.title=sp.name+': '+sp.start+' - '+sp.end;
      inner.addEventListener('mouseenter',function(){spDel.style.opacity='1';});
      inner.addEventListener('mouseleave',function(){spDel.style.opacity='0';});
      (function(s){
        inner.onclick=function(e){e.stopPropagation();_sprId=s.id;_selSprId=s.id;openCtx('sctx',e);};
        inner.addEventListener('mouseenter',function(){_selSprId=s.id;});
        spDel.onclick=function(e){e.stopPropagation();snapshot();D.sprints=D.sprints.filter(function(x){return x.id!==s.id;});save();render();};
      })(sp);
      var wrap=document.createElement('div');
      wrap.style.width=(count*WW_)+'px'; wrap.style.height=SPH+'px';
      wrap.style.display='flex'; wrap.style.alignItems='center';
      wrap.style.paddingLeft='1px';
      wrap.appendChild(inner); sprrow.appendChild(wrap);
    }
  }

  // ── months ──
  var MONTHS=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
  var mrow=document.getElementById('mrow');
  mrow.innerHTML=''; mrow.style.width=TW+'px'; mrow.style.height=MH+'px';
  var spans=[],cur=-1,cnt=0;
  for(var i=0;i<TL_WEEKS;i++){var m=wkDate(i).getMonth();if(m!==cur){if(cnt)spans[spans.length-1].count=cnt;spans.push({d:wkDate(i),count:0});cur=m;cnt=0;}cnt++;}
  if(spans.length)spans[spans.length-1].count=cnt;
  spans.reverse().forEach(function(s){
    var el=document.createElement('div'); el.className='mcell';
    el.style.width=(s.count*WW_)+'px'; el.style.height=MH+'px';
    el.textContent=MONTHS[s.d.getMonth()]+' '+s.d.getFullYear();
    mrow.appendChild(el);
  });

  // ── weeks ──
  var wkrow=document.getElementById('wkrow');
  wkrow.innerHTML=''; wkrow.style.width=TW+'px'; wkrow.style.height=WH+'px';
  for(var i=TL_WEEKS-1;i>=0;i--){
    var d=wkDate(i), isTW=TODAY.getTime()>=d.getTime()&&TODAY.getTime()<d.getTime()+7*86400000;
    var el=document.createElement('div'); el.className='wkcell'+(isTW?' tw':'');
    el.style.width=WW_+'px'; el.style.height=WH+'px';
    el.innerHTML='<span>'+d.getDate()+'/'+(d.getMonth()+1)+'</span>';
    wkrow.appendChild(el);
  }

  // ── body ──
  var body=document.getElementById('tlbody');
  body.innerHTML=''; body.style.width=TW+'px'; body.style.height=totalH+'px';
  // selection cleared only on delete or new selection

  gs.forEach(function(g){
    // group header
    var ghdr=document.createElement('div'); ghdr.className='ghdr-tl';
    ghdr.style.width=TW+'px'; ghdr.style.height=GH+'px';
    var gc=getGroupColor(g.team);
    ghdr.style.background=gc+'33';
    ghdr.style.borderBottomColor=gc;
    // allow assignments on group header row
    if(g.team){
      ghdr.dataset.wid='team_'+g.team.id;
      // render assignments for this team header
      D.assignments.filter(function(a){return a.workerId==='team_'+g.team.id;}).forEach(function(a){
        if(a.absence){var proj={name:a.absenceReason||'העדרות',color:'#2C2C2C',status:''};}else{var proj=D.projects.find(function(p){return p.id===a.projectId;});if(!proj)return;}
        var x=dateX(a.end);
        var xStart=dateX(a.start);
        var width=Math.max(xStart-x+WW_, WW_*0.4);
        if(x+width<0||x>TW)return;
        var blk=document.createElement('div'); blk.className='blk';
        blk.style.left=x+'px'; blk.style.width=width+'px';
        blk.style.height=(GH-6)+'px'; blk.style.top='3px';
        var tg=document.createElement('span'); tg.className='btitle';
        tg.textContent=a.absence?(a.absenceReason||'העדרות'):proj.name;
        if(a.absence){blk.style.background='#2C2C2C';tg.style.color='rgba(255,255,255,.85)';}
        else{blk.style.background=getDisplayColor(proj);if(proj.status==='שיבוץ על')tg.style.color='rgba(0,0,0,.75)';}
        blk.appendChild(tg);
        var noteEl=document.createElement('div'); noteEl.className='blk-notefield';
        noteEl.contentEditable=EDIT_MODE?'true':'false'; noteEl.textContent=a.note||'';
        noteEl.onclick=function(e){e.stopPropagation();}; noteEl.ondblclick=function(e){e.stopPropagation();};
        noteEl.onmousedown=function(e){e.stopPropagation();};
        noteEl.onblur=function(){var v=noteEl.textContent.trim();if(v!==a.note){snapshot();a.note=v;save();render();}};
        noteEl.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();noteEl.blur();}e.stopPropagation();};
        blk.appendChild(noteEl);

var _dragProjOrder=null, _dragProjOrderEl=null;
function renderProjPanel(){
  var el=document.getElementById('plist'); el.innerHTML='';

    nm.textContent=p.name;

    if(p.status&&p.status!=='בביצוע'){
      var stag=document.createElement('span');
      stag.style.cssText='font-size:9px;background:rgba(0,0,0,.12);border-radius:3px;padding:1px 4px;margin-right:4px;white-space:nowrap;';
      stag.textContent=p.status;
      nm.appendChild(stag);
    }
    var del=document.createElement('button'); del.className='pdel'; del.textContent='✕';
    del.onclick=function(e){e.stopPropagation();if(confirm('למחוק?')){snapshot();D.projects=D.projects.filter(function(x){return x.id!==p.id;});D.assignments=D.assignments.filter(function(a){return a.projectId!==p.id;});snapshot();save();render();}};
    var edt=document.createElement('button'); edt.className='pdel'; edt.textContent='✏️'; edt.style.opacity='0';
    edt.onclick=function(e){e.stopPropagation();openEditProject(p.id);};
    item.addEventListener('mouseenter',function(){edt.style.opacity='1';del.style.opacity='1';grip.style.opacity='1';});
    item.addEventListener('mouseleave',function(){edt.style.opacity='0';del.style.opacity='0';grip.style.opacity='.5';});
    item.appendChild(grip);item.appendChild(sq);item.appendChild(nm);item.appendChild(edt);item.appendChild(del);
    // grip drag = reorder
    grip.addEventListener('mousedown',function(e){e.stopPropagation();e.preventDefault();startProjReorder(e,p.id,item);});
    // click = toggle filter (only if not dragging)
    (function(proj){
      var dragging=false;
      item.addEventListener('mousedown',function(e){
        if(e.target===del||e.target===edt||e.target===grip)return;
        dragging=false;
        e.preventDefault();
        startProjDrag(e,proj,item);
      });
      item.addEventListener('click',function(e){
        if(e.target===del||e.target===edt||e.target===grip)return;
        if(dragging)return;
        FP=proj.id;
        render();
      });
    })(p);
    el.appendChild(item);
  });
}
var _reorderPid=null,_reorderY=0,_reorderEl=null;
function startProjReorder(e,pid,el){
  _reorderPid=pid; _reorderEl=el; _reorderY=e.clientY;
  el.style.opacity='.5';
  document.addEventListener('mousemove',onProjReorderMove);
  document.addEventListener('mouseup',onProjReorderEnd);
}
function onProjReorderMove(e){
  if(!_reorderPid)return;
  var list=document.getElementById('plist');
  var items=list.querySelectorAll('.pitem');
  items.forEach(function(item){
    if(item===_reorderEl)return;
    var rect=item.getBoundingClientRect();
    var mid=rect.top+rect.height/2;
    item.style.borderTop=e.clientY<mid&&e.clientY>rect.top-10?'2px solid var(--acc)':'';
    item.style.borderBottom=e.clientY>=mid&&e.clientY<rect.bottom+10?'2px solid var(--acc)':'';
  });
}
function onProjReorderEnd(e){
  document.removeEventListener('mousemove',onProjReorderMove);
  document.removeEventListener('mouseup',onProjReorderEnd);
  if(!_reorderPid){return;}
  var list=document.getElementById('plist');
  var items=list.querySelectorAll('.pitem');
  var targetPid=null, insertBefore=true;
  items.forEach(function(item){
    if(item===_reorderEl)return;
    if(item.style.borderTop){targetPid=item.dataset.pid;insertBefore=true;}
    if(item.style.borderBottom){targetPid=item.dataset.pid;insertBefore=false;}
    item.style.borderTop='';item.style.borderBottom='';
  });
  if(targetPid&&targetPid!==_reorderPid){
    var fromIdx=D.projects.findIndex(function(p){return p.id===_reorderPid;});
    var toIdx=D.projects.findIndex(function(p){return p.id===targetPid;});
    var proj=D.projects.splice(fromIdx,1)[0];
    var newIdx=D.projects.findIndex(function(p){return p.id===targetPid;});
    D.projects.splice(insertBefore?newIdx:newIdx+1,0,proj);
    save();
  }
  if(_reorderEl)_reorderEl.style.opacity='';
  _reorderPid=null;_reorderEl=null;
  renderProjPanel();
}

var RANGE_MONTHS=3; // default
var RANGES=[{m:3,label:'3 חודשים'},{m:6,label:'6 חודשים'},{m:12,label:'שנה'},{m:24,label:'שנתיים'}];

function mkLbl(txt){var s=document.createElement('span');s.className='flbl';s.textContent=txt;return s;}
function mkSep(){var s=document.createElement('div');s.style.cssText='width:1px;height:16px;background:var(--brd);margin:0 6px;flex-shrink:0;align-self:center;';return s;}
function renderFilter(){
  var bar=document.getElementById('fbar'); bar.innerHTML='';
  // project filter chip - show first
  if(FP!=='all'){
    var projF=D.projects.find(function(p){return p.id===FP;});
    if(projF){
      bar.appendChild(mkLbl('סינון:'));
      var allP=document.createElement('div');
      allP.className='chip on'; allP.style.background='#555'; allP.style.borderColor='transparent'; allP.style.color='#fff';
      allP.textContent='הכל';
      allP.onclick=function(){FP='all';render();};
      bar.appendChild(allP);
      var pchip=document.createElement('div');
      pchip.className='chip on'; pchip.style.background=projF.color; pchip.style.borderColor='transparent'; pchip.style.color='#fff';
      pchip.textContent=projF.name;
      bar.appendChild(pchip);
      bar.appendChild(mkSep());
    }
  }
  // Range chips
  bar.appendChild(mkLbl('טווח:'));
  RANGES.forEach(function(r){
    var c=document.createElement('div');
    c.className='chip'+(RANGE_MONTHS===r.m?' on':'');
    if(RANGE_MONTHS===r.m)c.style.background='#1E3A5F';
    c.textContent=r.label;
    c.onclick=function(){RANGE_MONTHS=r.m;quickRange(r.m);};
    bar.appendChild(c);
  });
  // Group chips (always visible)
  if(D.groups.length>0){
    bar.appendChild(mkSep());
    bar.appendChild(mkLbl('קבוצה:'));
    var allG=document.createElement('div'); allG.className='chip'+(FG==='all'?' on':'');
    if(FG==='all')allG.style.background='#555'; allG.textContent='הכל';
    allG.onclick=function(){FG='all';FT='all';render();}; bar.appendChild(allG);
    D.groups.forEach(function(g){
      var c=document.createElement('div'); c.className='chip'+(FG===g.id?' on':'');
      if(FG===g.id)c.style.background='#444'; c.textContent=g.name;
      c.onclick=function(){FG=g.id;FT='all';render();}; bar.appendChild(c);
    });
  }
  // Team chips — only show when a group is selected
  if(FG!=='all'){
    // find teams that have workers in this group
    var groupWorkers=D.workers.filter(function(w){return w.group===FG;});
    var teamIds=groupWorkers.map(function(w){return w.team;}).filter(Boolean);
    var relevantTeams=D.teams.filter(function(t){return teamIds.indexOf(t.id)>=0;});
    if(relevantTeams.length>0){
      bar.appendChild(mkSep());
      bar.appendChild(mkLbl('צוות:'));
      var allT=document.createElement('div'); allT.className='chip'+(FT==='all'?' on':'');
      if(FT==='all')allT.style.background='#555'; allT.textContent='הכל';
      allT.onclick=function(){FT='all';render();}; bar.appendChild(allT);
      relevantTeams.forEach(function(t){
        var c=document.createElement('div'); c.className='chip'+(FT===t.id?' on':'');
        if(FT===t.id)c.style.background=t.color; c.textContent=t.name;
        c.onclick=function(){FT=t.id;render();}; bar.appendChild(c);
      });

// ── drag & resize ─────────────────────────────────────────────────────────────
function makeDrag(blk,a){
  var sx,sl,drag=false,lastY=0,hoverRow=null;
  function mv(e){
    if(!drag)return;
    lastY=e.clientY;
    blk.style.left=Math.max(0,sl+(e.clientX-sx))+'px';
    var rows=document.getElementById('tlbody').querySelectorAll('.tlrow, .ghdr-tl');
    var found=null;
    rows.forEach(function(r){
      if(!r.dataset.wid)return;
      r.classList.remove('drop-row');
      var rect=r.getBoundingClientRect();
      if(e.clientY>=rect.top&&e.clientY<=rect.bottom)found=r;
    });
    if(found&&found.dataset.wid!==a.workerId)found.classList.add('drop-row');
    hoverRow=found;
  }
  function up(){
    if(!drag)return;drag=false;blk.classList.remove('drag');
    document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    document.getElementById('tlbody').querySelectorAll('.tlrow, .ghdr-tl').forEach(function(r){r.classList.remove('drop-row');});
    // RTL: left = dateX(end), after drag compute new end from left position
    var newLeftX=parseFloat(blk.style.left);
    var endWi=TL_WEEKS-1-Math.round(newLeftX/WW());
    endWi=Math.max(0,Math.min(TL_WEEKS-1,endWi));
    var dur=pd(a.end).getTime()-pd(a.start).getTime();
    var ne=fd(wkDate(endWi));
    var ns=fd(new Date(pd(ne).getTime()-dur));

    var targetWid=hoverRow?hoverRow.dataset.wid:null;
    snapshot();
    if(targetWid&&targetWid!==a.workerId){
      a.workerId=targetWid;a.start=ns;a.end=ne;
    } else {
      a.start=ns;a.end=ne;
    }
    save();render();
  }
  blk.addEventListener('mousedown',function(e){
    if(!EDIT_MODE)return;
    if(e.target.classList.contains('rhandle')||e.target.classList.contains('lhandle')||e.target.classList.contains('bedit')||e.target.classList.contains('binput'))return;
    drag=true;blk.classList.add('drag');sx=e.clientX;sl=parseFloat(blk.style.left);lastY=e.clientY;
    _selBlkId=a.id;
    document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);e.preventDefault();
  });
}
function makeResize(handle,blk,a){
  // RIGHT handle = right side of block = dateX(start) = changes START
  // drag right (positive dx) = x_right increases = start_week decreases = later start
  // drag left (negative dx) = x_right decreases = start_week increases = earlier start
  var sx,sw;
  function mv(e){blk.style.width=Math.max(WW()*0.4,sw+(e.clientX-sx))+'px';}
  function up(){
    document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    snapshot();
    var l=parseFloat(blk.style.left),w=parseFloat(blk.style.width);
    // right edge = l+w → start_week = TL_WEEKS-1 - round((l+w)/WW)
    var startWi=TL_WEEKS-1-Math.round((l+w)/WW());
    snapshot();
    a.start=fd(wkDate(Math.max(0,Math.min(TL_WEEKS-1,startWi))));
    save();render();
  }
  handle.addEventListener('mousedown',function(e){if(!EDIT_MODE)return;e.stopPropagation();e.preventDefault();sx=e.clientX;sw=parseFloat(blk.style.width);document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);});
}

// ── zoom ──────────────────────────────────────────────────────────────────────
function autoZoom(){
  // Pick WW so total range fits comfortably (target ~1200px for the timeline)
  var targetPx=1200;
  var idealWW=Math.floor(targetPx/TL_WEEKS);
  if(idealWW>=60){ZL=Math.round(idealWW/80*100);}
  else if(idealWW>=30){ZL=Math.round(idealWW/80*100);}
  else{ZL=40;} // minimum
  ZL=Math.max(40,Math.min(200,ZL));
  document.getElementById('zlbl').textContent=ZL+'%';
}

function doZoom(dir){
  var steps=[40,60,80,100,130,160,200];
  var idx=steps.findIndex(function(s){return s>=ZL;});if(idx===-1)idx=steps.length-1;
  idx=Math.max(0,Math.min(steps.length-1,idx+dir));
  ZL=steps[idx];document.getElementById('zlbl').textContent=ZL+'%';
  render();scrollToToday();
}
function scrollToToday(){
  setTimeout(function(){
    var wrap=document.getElementById('tlwrap');
    var x=dateX(fd(TODAY));
    // today is at x pixels from left in our RTL layout
    // scroll so today is near the right side of view
    wrap.scrollLeft=Math.max(0,x-wrap.clientWidth*0.7);
  },50);
}

function makeResizeLeft(handle,blk,a){
  // LEFT handle = left side of block = dateX(end) = changes END
  // drag left (negative dx) = x_left decreases = end_week increases = earlier end
  // drag right (positive dx) = x_left increases = end_week decreases = later end
  var sx,sl,sw;
  function mv(e){
    var dx=e.clientX-sx;
    var newLeft=Math.max(0,sl+dx);
    var newW=Math.max(WW()*0.4,sw-dx);
    blk.style.left=newLeft+'px';
    blk.style.width=newW+'px';
  }
  function up(){
    document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
    snapshot();
    var l=parseFloat(blk.style.left);
    // left edge = l → end_week = TL_WEEKS-1 - round(l/WW)
    var endWi=TL_WEEKS-1-Math.round(l/WW());
    snapshot();
    a.end=fd(wkDate(Math.max(0,Math.min(TL_WEEKS-1,endWi))));
    save();render();
  }
  handle.addEventListener('mousedown',function(e){
    if(!EDIT_MODE)return;
    e.stopPropagation();e.preventDefault();
    sx=e.clientX;sl=parseFloat(blk.style.left);sw=parseFloat(blk.style.width);

// ── project panel drag to timeline ───────────────────────────────────────────
var _dProj=null, _dGhost=null, _dSrcItem=null;

function startProjDrag(e,proj,item){
  if(!EDIT_MODE)return;
  _dProj=proj; _dSrcItem=item;
  item.classList.add('proj-dragging');
  _dGhost=document.createElement('div');
  _dGhost.style.cssText='position:fixed;pointer-events:none;z-index:999;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.3);';
  _dGhost.style.background=proj.color;
  _dGhost.textContent=proj.name;
  document.body.appendChild(_dGhost);
  moveProjGhost(e);
  document.addEventListener('mousemove',moveProjGhost);
  document.addEventListener('mouseup',endProjDrag);
}
function moveProjGhost(e){
  if(!_dGhost)return;
  _dGhost.style.left=(e.clientX+12)+'px';
  _dGhost.style.top=(e.clientY-10)+'px';
  // highlight target row
  var rows=document.getElementById('tlbody').querySelectorAll('.tlrow, .ghdr-tl');
  rows.forEach(function(r){
    if(!r.dataset.wid)return;
    r.classList.remove('drop-highlight');
    var rect=r.getBoundingClientRect();
    if(e.clientY>=rect.top&&e.clientY<=rect.bottom&&e.clientX>=rect.left&&e.clientX<=rect.right)
      r.classList.add('drop-highlight');
  });
}
function endProjDrag(e){
  document.removeEventListener('mousemove',moveProjGhost);
  document.removeEventListener('mouseup',endProjDrag);
  if(_dGhost){_dGhost.remove();_dGhost=null;}
  if(_dSrcItem){_dSrcItem.classList.remove('proj-dragging');_dSrcItem=null;}
  document.getElementById('tlbody').querySelectorAll('.tlrow').forEach(function(r){r.classList.remove('drop-highlight');});
  if(!_dProj)return;
  var rows=document.getElementById('tlbody').querySelectorAll('.tlrow, .ghdr-tl');
  var targetRow=null;
  rows.forEach(function(r){
    if(!r.dataset.wid)return;
    var rect=r.getBoundingClientRect();
    if(e.clientY>=rect.top&&e.clientY<=rect.bottom&&e.clientX>=rect.left&&e.clientX<=rect.right)
      targetRow=r;
  });
  if(targetRow&&targetRow.dataset.wid){
    var tlwrap=document.getElementById('tlwrap');
    var tlRect=tlwrap.getBoundingClientRect();
    // RTL: scrollLeft counts from right edge
    var scrollOffset=tlwrap.scrollWidth-tlwrap.clientWidth-tlwrap.scrollLeft;
    var x=e.clientX-tlRect.left+scrollOffset;
    // adjust for week boundary
    x=Math.max(0,x);
    var wi=TL_WEEKS-1-Math.floor(x/WW());
    wi=Math.max(0,Math.min(TL_WEEKS-1,wi));
    var start=fd(wkDate(wi));
    if(_dProj.absence){
      // absence: direct assign for 1 week, user can resize
      snapshot();
      D.assignments.push({id:'a'+Date.now(),workerId:targetRow.dataset.wid,projectId:'__absence__',start:start,end:fd(wkDate(Math.min(wi+1,TL_WEEKS-1))),note:'',absence:true,absenceReason:'העדרות'});
      save();render();
    } else {
      snapshot();D.assignments.push({id:'a'+Date.now(),workerId:targetRow.dataset.wid,projectId:_dProj.id,start:start,end:fd(wkDate(Math.min(wi+1,TL_WEEKS-1))),note:''});
      save();render();
    }
  }
  _dProj=null;
}

// ── import sprints from CSV ──────────────────────────────────────────────────
// Expected CSV format: שם,התחלה,סיום (e.g. Sprint 1,2026-05-01,2026-05-14)
function importSprints(event){
  var file=event.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result.replace(/^\uFEFF/,'');
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2){alert('הקובץ ריק או לא תקין\nפורמט נדרש: שם,תאריך התחלה,תאריך סיום');return;}
    var delim=lines[0].indexOf('\t')>=0?'\t':',';
    var added=0,skipped=0,errors=0;
    function fixSprintDate(d){
      var m=d.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      if(m)return m[3]+'-'+(m[2].length<2?'0':'')+m[2]+'-'+(m[1].length<2?'0':'')+m[1];
      return d;
    }
    for(var i=1;i<lines.length;i++){
      var cols=lines[i].split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
      var name=cols[0], startRaw=cols[1], col3=cols[2]||'';
      if(!name||!startRaw){errors++;continue;}
      var start=fixSprintDate(startRaw);
      var end;
      var weeks=parseInt(col3);
      if(!isNaN(weeks)&&weeks>0){
        end=weeksToEnd(start,weeks);
      } else if(col3){
        end=fixSprintDate(col3);
      } else {
        end=weeksToEnd(start,2);
      }
      if(isNaN(new Date(start).getTime())||isNaN(new Date(end).getTime())){errors++;continue;}
      // Check duplicate
      if(D.sprints.find(function(s){return s.name===name;})){skipped++;continue;}
      D.sprints.push({id:'sp'+Date.now()+'_'+i,name:name,start:start,end:end});
      added++;
    }
    snapshot();save();render();
    var msg='יובאו '+added+' ספרינטים';
    if(skipped) msg+=' ('+skipped+' כבר קיימים)';
    if(errors) msg+=' ('+errors+' שגיאות)';
    showToast(msg);
  };
  reader.readAsText(file,'UTF-8');
  event.target.value='';
}

// ── global keyboard shortcuts ────────────────────────────────────────────────
var _clipboard=null, _hovWrkId=null, _hovWeekDate=null;
document.addEventListener('keydown',function(e){
  // Escape - close modals
  if(e.key==='Escape'){['wmodal','pmodal','sprmodal','amodal','rangemodal','epmodal','msmodal'].forEach(cm);return;}
  // allow Ctrl+Z/Y even in view mode
  var isUndo=((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey));
  var isRedo=((e.key==='y'||e.key==='Y')&&(e.ctrlKey||e.metaKey))||((e.key==='z'||e.key==='Z')&&(e.ctrlKey||e.metaKey)&&e.shiftKey);
  if(!EDIT_MODE&&!isUndo&&!isRedo)return; // block shortcuts in view mode except undo/redo
  var tag=document.activeElement.tagName;
  var isCE=document.activeElement.contentEditable==='true';
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||isCE)return;
  // Delete assignment
  if((e.key==='Delete'||e.key==='Backspace')&&_selBlkId){
    snapshot();D.assignments=D.assignments.filter(function(x){return x.id!==_selBlkId;});
    _selBlkId=null; save();render();
  }
  // Delete sprint
  else if((e.key==='Delete'||e.key==='Backspace')&&_selSprId){
    snapshot();D.sprints=D.sprints.filter(function(x){return x.id!==_selSprId;});
    _selSprId=null; save();render();
  }
  // Ctrl+C — copy selected assignment
  if((e.key==='c'||e.key==='C'||e.keyCode===67)&&(e.ctrlKey||e.metaKey)&&_selBlkId){
    var a=D.assignments.find(function(x){return x.id===_selBlkId;});
    if(a){_clipboard=JSON.parse(JSON.stringify(a));showToast('שיבוץ הועתק ✓');}
  }
  // Ctrl+Z — undo
  if((e.key==='z'||e.key==='Z'||e.keyCode===90)&&(e.ctrlKey||e.metaKey)&&!e.shiftKey){
    e.preventDefault();
    if(_undoStack.length>0){
      _redoStack.push(JSON.stringify(D));
      var snap=_undoStack.pop();
      D=JSON.parse(snap);
      save();render();showToast('ביטול ✓');
    } else {
      showToast('אין פעולות לביטול');
    }
    return;
  }
  // Ctrl+Y / Ctrl+Shift+Z — redo
  if(((e.key==='y'||e.key==='Y'||e.keyCode===89)&&(e.ctrlKey||e.metaKey))||
     ((e.key==='z'||e.key==='Z'||e.keyCode===90)&&(e.ctrlKey||e.metaKey)&&e.shiftKey)){
    e.preventDefault();
    if(_redoStack.length>0){
      _undoStack.push(JSON.stringify(D));
      D=JSON.parse(_redoStack.pop());
      save();render();showToast('החזרה ✓');
    }
    return;
  }
  // Ctrl+V — paste on hovered worker (or same worker if none hovered)
  if((e.key==='v'||e.key==='V'||e.keyCode===86)&&(e.ctrlKey||e.metaKey)&&_clipboard){
    e.preventDefault();
    var targetWid=_hovWrkId||_clipboard.workerId;
    var diff=pd(_clipboard.end).getTime()-pd(_clipboard.start).getTime();
    var newStart, newEnd;
    if(_hovWeekDate){
      // paste at hovered week position
      newStart=_hovWeekDate;
      newEnd=fd(new Date(pd(newStart).getTime()+diff));
    } else if(targetWid===_clipboard.workerId){
      // same worker, no hover position - shift 1 week after original
      newStart=fd(new Date(pd(_clipboard.end).getTime()+7*86400000));
      newEnd=fd(new Date(pd(newStart).getTime()+diff));
    } else {
      // different worker, keep same dates
      newStart=_clipboard.start;
      newEnd=_clipboard.end;
    }
    snapshot();D.assignments.push({id:'a'+Date.now(),workerId:targetWid,projectId:_clipboard.projectId,start:newStart,end:newEnd,note:_clipboard.note||''});
    snapshot();save();render();showToast('שיבוץ הודבק ✓');
  }
});

// ── import workers from CSV ───────────────────────────────────────────────────
function importWorkers(event){
  var file=event.target.files[0];
  if(!file)return;
  console.log('importWorkers called, file:', file.name, file.size);
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    // Remove BOM if present
    text=text.replace(/^\uFEFF/,'');
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    console.log('Import debug: lines='+lines.length+', first='+lines[0]+', second='+(lines[1]||''));
    if(lines.length<2){alert('הקובץ ריק או לא תקין');return;}
    // Detect delimiter
    var delim=lines[0].indexOf('\t')>=0?'\t':',';
    // Skip header row
    var added=0,skipped=0;
    for(var i=1;i<lines.length;i++){
      var cols=lines[i].split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
      var name=cols[0];
      var groupName=cols[1]||'';
      var team=cols[2]||'';
      if(!name)continue;
      // Check if worker already exists
      if(D.workers.find(function(w){return w.name.trim()===name.trim();})){skipped++;continue;}
      // Find or create team
      var teamId='';
      if(team){
        var t=D.teams.find(function(t){return t.name===team;});
        if(!t){t={id:'t'+Date.now()+'_'+i,name:team,color:COLS[D.teams.length%COLS.length]};D.teams.push(t);}
        teamId=t.id;
      }
      var groupId='';
      if(groupName){
        var grp=D.groups.find(function(g){return g.name===groupName;});
        if(!grp){grp={id:'g'+Date.now()+'_'+i,name:groupName};D.groups.push(grp);}
        groupId=grp.id;
      }
      D.workers.push({id:'w'+Date.now()+'_'+i,name:name,team:teamId,group:groupId});
      added++;
    }
    console.log('Workers added:', added, 'skipped:', skipped);
    snapshot();save();render();
    showToast('יובאו '+added+' עובדים'+(skipped?' ('+skipped+' כבר קיימים)':''));
  };
  reader.readAsText(file);
  event.target.value='';
}

// ── import milestones ─────────────────────────────────────────────────────────
// CSV format: שם, תאריך (DD/MM/YYYY or YYYY-MM-DD), פרויקט
function importMilestones(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result.replace(/^﻿/,'');
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2){alert('הקובץ ריק');return;}
    var delim=lines[0].indexOf('\t')>=0?'\t':',';
    var added=0,errors=0;
    for(var i=1;i<lines.length;i++){
      var cols=lines[i].split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
      var name=cols[0],dateRaw=cols[1]||'',projName=cols[2]||'';
      if(!name||!dateRaw){errors++;continue;}
      var mx=dateRaw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      var date=mx?mx[3]+'-'+(mx[2].length<2?'0':'')+mx[2]+'-'+(mx[1].length<2?'0':'')+mx[1]:dateRaw;
      if(isNaN(new Date(date).getTime())){errors++;continue;}
      var proj=D.projects.find(function(p){return p.name===projName;})||D.projects[0];
      if(!proj){errors++;continue;}
      D.milestones.push({id:'ms'+Date.now()+'_'+i,name:name,date:date,projectId:proj.id});
      added++;
    }
    snapshot();save();render();
    showToast('יובאו '+added+' אבני דרך'+(errors?' ('+errors+' שגיאות)':''));
  };
  reader.readAsText(file,'UTF-8');
  event.target.value='';
}

function exportProjects(){

  var a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='פרויקטים.csv';a.click();
}

function importProjects(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result.replace(/^﻿/,'');
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2)return;
    var delim=lines[0].indexOf('	')>=0?'	':',';
    var added=0,updated=0;
    for(var i=1;i<lines.length;i++){
      var cols=lines[i].split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
      var name=cols[0],code=cols[1]||'',status=cols[2]||'בביצוע',colorIdx=parseInt(cols[3]);
      if(!name)continue;
      var color=(colorIdx>=0&&colorIdx<COLS.length)?COLS[colorIdx]:COLS[0];
      var existing=D.projects.find(function(p){return p.name===name;});
      if(existing){existing.code=code;existing.status=status;existing.color=color;updated++;}
      else{D.projects.push({id:'p'+Date.now()+'_'+i,name:name,color:color,status:status,code:code});added++;}
    }
    snapshot();save();render();
    showToast('יובאו '+added+' פרויקטים חדשים, עודכנו '+updated);
  };
  reader.readAsText(file);event.target.value='';
}

// ── export/import assignments ─────────────────────────────────────────────────
function importAssignments(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result.replace(/^﻿/,'');
    var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
    if(lines.length<2)return;
    var delim=lines[0].indexOf('	')>=0?'	':',';
    var added=0,errors=0;
    for(var i=1;i<lines.length;i++){
      var cols=lines[i].split(delim).map(function(c){return c.replace(/^"|"$/g,'').trim();});
      // format: עובד, פרויקט/העדרות, התחלה, סיום, הערה
      var wname=cols[0],pname=cols[1],start=cols[2],end=cols[3],note=cols[4]||'';
      if(!wname||!pname||!start||!end){errors++;continue;}
      var w=D.workers.find(function(w){return w.name===wname;});
      if(!w){console.log('Worker not found:',wname,'Available:',D.workers.map(function(x){return x.name;}));errors++;continue;}
      var absence=pname==='העדרות';
      var pid=absence?'__absence__':'';
      if(!absence){var proj=D.projects.find(function(p){return p.name===pname||p.code===pname;});if(!proj){console.log('Project not found:',pname,'Available:',D.projects.map(function(x){return x.name;}));errors++;continue;}pid=proj.id;}
      D.assignments.push({id:'a'+Date.now()+'_'+i,workerId:w.id,projectId:pid,start:start,end:end,note:note,absence:absence,absenceReason:absence?'העדרות':''});
      added++;
    }
    snapshot();save();render();
    showToast('יובאו '+added+' שיבוצים'+(errors?' ('+errors+' שגיאות)':''));
  };
  reader.readAsText(file);event.target.value='';
}
